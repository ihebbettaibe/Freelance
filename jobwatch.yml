name: jobwatch

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:          # lets you run it by hand from the Actions tab
    inputs:
      test:
        description: "Only send a test message"
        type: boolean
        default: false

permissions:
  contents: write             # to save seen.json back to the repo

concurrency:
  group: jobwatch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check for new jobs
        run: python jobwatch.py ${{ inputs.test && '--test' || '--once --notify-existing 3' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MIN_SCORE: ${{ vars.MIN_SCORE }}
      - name: Remember the jobs already sent
        if: always()
        run: |
          git config user.name "jobwatch-bot"
          git config user.email "jobwatch-bot@users.noreply.github.com"
          git add seen.json 2>/dev/null || exit 0
          git diff --cached --quiet || (git commit -m "Update seen jobs" && git push)
